name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy matplotlib jinja2 pytest
      - name: Unit and workflow tests (fake external tools)
        run: pytest -q tests
      - name: GUI smoke test (normal + browser mode)
        run: pip install streamlit && python tests/gui_smoke.py
